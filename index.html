<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переулок — Аудиокомикс</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="assets/frame-01-alley.webp" as="image">
  <link rel="preload" href="assets/frame-02-bar.webp" as="image">
  <link rel="preload" href="assets/Газетчица Даша у двери бара.png" as="image">
  <script src="player.js" defer></script>
</head>
<body>
  <main>
    <header><a class="brand" href="./">АУДИОКОМИКС<span>ИСТОРИИ, КОТОРЫЕ ОЖИВАЮТ</span></a><span class="edition">ПИЛОТНЫЙ ВЫПУСК / 01</span></header>
    <section class="intro"><p class="eyebrow">ГАНГСТЕРСКАЯ КОМЕДИЯ · 1930-е</p><h1>Переулок<span>.</span></h1><p>Большие дела начинаются в маленьких переулках.</p></section>
    <section class="player" aria-label="Плеер истории Переулок">
      <div class="toolbar"><span>ИСТОРИЯ 01 <span class="muted">/ ДЕМОНСТРАЦИЯ</span></span><div class="modes" role="group" aria-label="Режим просмотра"><button id="cinema" aria-pressed="true">Кино</button><button id="comic" aria-pressed="false">Комикс</button></div></div>
      <div class="screen alley-frame image-only"><div class="visual"><img id="frame" src="assets/frame-01-alley.webp" alt="Ночной переулок с фонарями и входом в бар"><div class="screen-label">ПЕРЕУЛОК <span>1932</span></div></div><div class="caption" aria-live="polite" aria-atomic="true"><p id="speaker"></p><p id="dialogue" aria-hidden="true"></p><p id="accessible-dialogue" class="sr-only"></p></div></div>
      <div class="progress" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="controls"><button id="back" aria-label="Предыдущий кадр">← Назад</button><button id="start" class="primary">Начать ▶</button><button id="next" aria-label="Следующий кадр">Вперёд →</button></div>
      <div class="details"><span id="counter"></span><span id="status" role="status"></span></div>
    </section>
    <footer><p id="hint">В режиме «Кино»: первый кадр — 16 секунд, второй — 10, третий — 12.</p><p>Озвучка, музыка и эффекты появятся позже</p></footer>
  </main>
</body>
</html>
